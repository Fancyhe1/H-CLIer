<!doctype html>
<html lang="zh-CN" style="background:#141414">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H CLIer</title>
    <style>
      /* 内联 splash —— 窗口出现即显示，不依赖 React */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141414;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .splash-inner img {
        width: 96px;
        height: 96px;
        border-radius: 16px;
        animation: splash-float 2s ease-in-out infinite;
      }
      .splash-inner .splash-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        margin: 0;
      }
      .splash-inner .splash-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #888;
        margin: 0;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(105, 177, 255, 0.2);
        border-top-color: #69b1ff;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 内联 splash：React 挂载前即可显示 -->
    <div id="splash">
      <div class="splash-inner">
        <img src="/icon.png" alt="H CLIer" />
        <p class="splash-title">H CLIer</p>
        <p class="splash-sub">Claude Code 会话管理与工作台</p>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // React 挂载后移除内联 splash
      window.__removeSplash = function() {
        var el = document.getElementById('splash');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(function() { el.remove(); }, 300);
        }
      };
    </script>
  </body>
</html>
