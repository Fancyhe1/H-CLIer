<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Terminal icon -->
  <g transform="translate(128, 100)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="256" height="200" rx="16" fill="#0a0a15" stroke="url(#accent)" stroke-width="8"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="256" height="40" rx="16" fill="#1a1a2e"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="20" r="6" fill="#27c93f"/>
    <!-- Terminal text -->
    <text x="24" y="80" font-family="monospace" font-size="28" fill="#4facfe">$</text>
    <rect x="48" y="60" width="120" height="4" rx="2" fill="#00f2fe" opacity="0.8"/>
    <rect x="48" y="80" width="80" height="4" rx="2" fill="#4facfe" opacity="0.6"/>
    <rect x="24" y="110" width="180" height="4" rx="2" fill="#4facfe" opacity="0.4"/>
    <rect x="24" y="130" width="140" height="4" rx="2" fill="#4facfe" opacity="0.3"/>
    <rect x="24" y="150" width="160" height="4" rx="2" fill="#4facfe" opacity="0.2"/>
  </g>
  <!-- AI brain icon -->
  <g transform="translate(320, 320)">
    <circle cx="0" cy="0" r="60" fill="url(#accent)" opacity="0.9"/>
    <text x="-20" y="20" font-family="Arial" font-size="48" fill="#0f0f1a" font-weight="bold">AI</text>
  </g>
</svg>
