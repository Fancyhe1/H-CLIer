name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app (unsigned)
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri:build

      - name: Get version
        id: version
        run: |
          $version = "${{ github.ref_name }}".Replace("refs/tags/v", "")
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Get exe path
        id: exe
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem "aicoder/src-tauri/target/release/bundle/nsis/*.exe"
          if ($exeFiles) {
            $exe = $exeFiles[0]
            echo "EXE_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "EXE_FULLNAME=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "No exe found"
            Get-ChildItem "aicoder/src-tauri/target/release/bundle/nsis/" -Recurse
          }

      - name: Debug signing
        shell: pwsh
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY length: $($env:TAURI_SIGNING_PRIVATE_KEY.Length)"

      - name: Sign the app
        if: vars.EXE_FULLNAME != ''
        shell: pwsh
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $exePath = "${{ steps.exe.outputs.EXE_FULLNAME }}"
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          Write-Host "Signing file: $exePath"
          Write-Host "Key length: $($key.Length)"
          & npm run tauri signer sign -- --private-key $key $exePath

      - name: Create GitHub Release
        if: vars.EXE_FULLNAME != ''
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest.json with signature
        id: latest
        shell: pwsh
        run: |
          $exePath = "${{ steps.exe.outputs.EXE_FULLNAME }}"
          if (-not $exePath -or $exePath -eq '') {
            echo "No exe path, skipping latest.json"
            exit 0
          }
          $sigPath = "$exePath.sig"
          $exe = Get-ChildItem $exePath
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $signature = if (Test-Path $sigPath) { (Get-Content $sigPath -Raw).Trim() } else { "" }
          $version = "${{ steps.version.outputs.VERSION }}"

          $latestJson = @{
            version = $version
            date = (Get-Date -Format "yyyy-MM-dd")
            body = "Release v$version"
            url = "https://github.com/Fancyhe1/H-CLIer/releases/download/v$version/$($exe.Name)"
            sha256 = $sha256
            signature = $signature
          } | ConvertTo-Json -Compress

          Set-Content -Path latest.json -Value $latestJson -Encoding UTF8
          echo "SIGNATURE_LENGTH=$($signature.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload latest.json to H-CLIer repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $SHA = $(gh api repos/Fancyhe1/H-CLIer/contents/latest.json --jq '.sha' 2>/dev/null)
          $BODY = "Update latest.json for v$version"

          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("latest.json"))

          if ($SHA) {
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json `
              --method PUT `
              --field message="$BODY" `
              --field content="$content" `
              --field branch=main `
              --field sha="$SHA"
          } else {
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json `
              --method PUT `
              --field message="$BODY" `
              --field content="$content" `
              --field branch=main
          }