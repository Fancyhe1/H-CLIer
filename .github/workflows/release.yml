name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app (with auto-signing)
        working-directory: ./aicoder
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Debug - list bundle contents
        working-directory: ./aicoder
        shell: bash
        run: |
          echo "=== Bundle directory contents ==="
          ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "Directory not found"
          echo ""
          echo "=== Looking for .exe files ==="
          find src-tauri/target/release/bundle -name "*.exe" 2>/dev/null
          echo ""
          echo "=== Looking for .sig files ==="
          find src-tauri/target/release/bundle -name "*.sig" 2>/dev/null

      - name: Generate latest.json
        working-directory: ./aicoder
        shell: bash
        run: |
          echo "=== Debug environment ==="
          echo "CWD: $(pwd)"
          echo "TAG: ${{ github.ref_name }}"

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          echo "=== Looking for exe ==="
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v "_0.exe" | head -1)
          echo "Found EXE: $EXE"

          if [ -z "$EXE" ]; then
            echo "ERROR: No exe found"
            exit 1
          fi

          EXE_NAME="$(basename "$EXE")"
          SIG_PATH="${EXE}.sig"
          echo "SIG_PATH: $SIG_PATH"

          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\r\n')
            echo "Signature length: ${#SIGNATURE}"
          else
            echo "WARNING: Signature file not found"
            SIGNATURE=""
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/${{ github.ref_name }}/$EXE_NAME"
              }
            }
          }
          JSONEOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Upload to H-CLIer Release
        working-directory: ./aicoder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v "_0.exe" | head -1)

          if [ -z "$EXE" ]; then
            echo "ERROR: No exe found"
            exit 1
          fi

          SIG_PATH="${EXE}.sig"
          EXE_NAME="$(basename "$EXE")"

          echo "Uploading $EXE_NAME to H-CLIer..."

          # Create release using GitHub CLI
          gh release create "${{ github.ref_name }}" \
            --repo Fancyhe1/H-CLIer \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --make-latest true \
            --generate-notes

          # Upload assets
          echo "Uploading exe..."
          gh release upload "${{ github.ref_name }}" "$EXE" --repo Fancyhe1/H-CLIer

          if [ -f "$SIG_PATH" ]; then
            echo "Uploading sig..."
            gh release upload "${{ github.ref_name }}" "$SIG_PATH" --repo Fancyhe1/H-CLIer
          fi

          echo "Uploading latest.json..."
          gh release upload "${{ github.ref_name }}" "latest.json" --repo Fancyhe1/H-CLIer

          echo "=== Done ==="