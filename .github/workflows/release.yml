name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri:build

      - name: Get exe info
        id: exe
        shell: bash
        run: |
          EXE_FILES=$(find aicoder/src-tauri/target/release/bundle/nsis -name "*.exe" -not -name "*.0.exe" | head -1)
          echo "EXE_PATH=$EXE_FILES"
          echo "EXE_NAME=$(basename $EXE_FILES)"
          echo "EXE_DIR=$(dirname $EXE_FILES)"

      - name: Sign the app
        shell: bash
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          echo "Signing: $EXE_PATH"
          echo "Key length: ${#TAURI_SIGNING_PRIVATE_KEY}"
          npm run tauri signer sign -- --private-key "$TAURI_SIGNING_PRIVATE_KEY" "$EXE_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest.json
        id: latest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}" | sed 's/refs\/tags\/v//'
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          SIG_PATH="${EXE_PATH}.sig"
          EXE_NAME="$(basename $EXE_PATH)"

          SHA256=$(powershell -Command "(Get-FileHash '$EXE_PATH' -Algorithm SHA256).Hash.ToLower()")

          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\n')
          else
            SIGNATURE=""
          fi

          echo "SIGNATURE_LENGTH=${#SIGNATURE}"

          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "date": "$(date +%Y-%m-%d)",
            "body": "Release $VERSION",
            "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/$VERSION/$EXE_NAME",
            "sha256": "$SHA256",
            "signature": "$SIGNATURE"
          }
          EOF

          cat latest.json

      - name: Upload latest.json to H-CLIer repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}" | sed 's/refs\/tags\/v//'
          SHA=$(gh api repos/Fancyhe1/H-CLIer/contents/latest.json --jq '.sha' 2>/dev/null || echo "")

          CONTENT=$(cat latest.json | base64 -w 0)

          if [ -n "$SHA" ]; then
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main \
              --field sha="$SHA"
          else
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main
          fi