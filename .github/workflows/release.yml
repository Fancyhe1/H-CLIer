name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write          # 允许创建 Release（配合 PAT 有效）
    env:
      # Tauri 签名密钥（从 Secrets 读取）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      # 构建时会自动签名（因为设置了 TAURI_SIGNING_PRIVATE_KEY 环境变量）
      - name: Build Tauri app
        working-directory: ./aicoder
        run: npm run tauri:build

      - name: Find exe and sig
        id: exe
        shell: bash
        run: |
          EXE=$(ls aicoder/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v ".0.exe" | head -1)
          echo "EXE_PATH=$EXE" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$(basename $EXE)" >> $GITHUB_OUTPUT
          SIG_PATH="${EXE}.sig"
          if [ -f "$SIG_PATH" ]; then
            echo "SIG_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "SIG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      # 可选：如果自动签名失败，手动签名（兜底）
      - name: Sign manually if needed
        if: steps.exe.outputs.SIG_EXISTS == 'false'
        working-directory: ./aicoder
        shell: bash
        run: |
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          echo "Signing $EXE_PATH manually"
          npm run tauri signer sign -- "$EXE_PATH"

      - name: Create latest.json
        if: steps.exe.outputs.EXE_PATH != ''
        id: latest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#refs/tags/}"
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          EXE_NAME="$(basename "$EXE_PATH")"
          SIG_PATH="${EXE_PATH}.sig"
          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\n')
            echo "SIGNATURE_LENGTH=${#SIGNATURE}" >> $GITHUB_OUTPUT
          else
            echo "❌ .sig file missing after build and manual attempt"
            exit 1
          fi
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/$VERSION/$EXE_NAME"
              }
            }
          }
          JSONEOF
          echo "=== latest.json ==="
          cat latest.json

      # 创建 Release 在公开仓库 H-CLIer
      - name: Create GitHub Release on H-CLIer
        if: steps.exe.outputs.EXE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: Fancyhe1/H-CLIer      # 目标公开仓库
          token: ${{ secrets.GH_PAT }}       # 使用 PAT（需具有 repo 范围）
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          make_latest: true

      # 推送 latest.json 到公开仓库根目录（用于 Tauri 更新器）
      - name: Upload latest.json to H-CLIer repo root
        if: steps.latest.outputs.SIGNATURE_LENGTH != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}    # 使用 PAT 而非 GITHUB_TOKEN
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#refs/tags/}"
          SHA=$(gh api repos/Fancyhe1/H-CLIer/contents/latest.json --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(cat latest.json | base64 -w 0)
          if [ -n "$SHA" ]; then
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main \
              --field sha="$SHA"
          else
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main
          fi
