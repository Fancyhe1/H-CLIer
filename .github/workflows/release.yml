name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app (with auto-signing)
        working-directory: ./aicoder
        shell: bash
        run: |
          echo "=== Build starting ==="
          echo "TAURI_SIGNING_PRIVATE_KEY is set: ${#TAURI_SIGNING_PRIVATE_KEY} chars"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set: ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD} chars"

          npm run tauri build

          echo "=== Build completed ==="
          echo "Checking for exe files..."
          find src-tauri/target/release/bundle -name "*.exe" -type f 2>/dev/null
          echo "Checking for sig files..."
          find src-tauri/target/release/bundle -name "*.sig" -type f 2>/dev/null
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Debug - list bundle contents
        working-directory: ./aicoder
        shell: bash
        run: |
          echo "=== Bundle directory contents ==="
          ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "Directory not found"

      - name: Generate latest.json
        working-directory: ./aicoder
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"

          echo "=== Looking for installer ==="
          EXE_PATH=$(ls "$BUNDLE_DIR"/*_x64-setup.exe 2>/dev/null | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "ERROR: Installer exe not found in $BUNDLE_DIR"
            ls -la "$BUNDLE_DIR" 2>/dev/null || echo "Directory not accessible"
            exit 1
          fi
          EXE_NAME=$(basename "$EXE_PATH")
          echo "Found EXE: $EXE_NAME"

          SIG_PATH="${EXE_PATH}.sig"
          echo "Looking for SIG: $SIG_PATH"
          if [ ! -f "$SIG_PATH" ]; then
            echo "ERROR: Signature file not found: $SIG_PATH"
            exit 1
          fi

          SIGNATURE=$(cat "$SIG_PATH" | tr -d '\r\n')
          echo "Signature length: ${#SIGNATURE}"

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/${{ github.ref_name }}/$EXE_NAME"
              }
            }
          }
          JSONEOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Upload to H-CLIer Release
        working-directory: ./aicoder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"

          EXE_PATH=$(ls "$BUNDLE_DIR"/*_x64-setup.exe 2>/dev/null | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "ERROR: No exe found"
            exit 1
          fi

          SIG_PATH="${EXE_PATH}.sig"
          EXE_NAME=$(basename "$EXE_PATH")

          echo "Creating release and uploading $EXE_NAME..."

          gh release create "${{ github.ref_name }}" \
            --repo Fancyhe1/H-CLIer \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            --make-latest true \
            --generate-notes

          echo "Uploading exe..."
          gh release upload "${{ github.ref_name }}" "$EXE_PATH" --repo Fancyhe1/H-CLIer

          if [ -f "$SIG_PATH" ]; then
            echo "Uploading sig..."
            gh release upload "${{ github.ref_name }}" "$SIG_PATH" --repo Fancyhe1/H-CLIer
          fi

          echo "Uploading latest.json..."
          gh release upload "${{ github.ref_name }}" "latest.json" --repo Fancyhe1/H-CLIer

          echo "=== Done ==="