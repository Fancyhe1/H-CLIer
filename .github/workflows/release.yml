name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app
        working-directory: ./aicoder
        run: npm run tauri:build

      - name: Find exe
        id: exe
        shell: bash
        run: |
          EXE=$(ls aicoder/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v "_0.exe" | head -1)
          echo "EXE_PATH=$EXE" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$(basename "$EXE")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release on H-CLIer
        if: steps.exe.outputs.EXE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: Fancyhe1/H-CLIer
          token: ${{ secrets.GH_PAT }}
          files: aicoder/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          make_latest: true