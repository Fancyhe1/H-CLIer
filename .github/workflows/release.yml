name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app
        working-directory: ./aicoder
        run: npm run tauri:build

      # 👇 这一步是我帮你加上的 —— 自动签名（核心！）
      - name: Sign the executable
        working-directory: ./aicoder
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | grep -v ".0.exe" | head -1)
          npm run tauri signer sign -- "$EXE"

      - name: Find exe & sig
        id: exe
        shell: bash
        run: |
          EXE=$(ls aicoder/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v ".0.exe" | head -1)
          echo "EXE_PATH=$EXE" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$(basename $EXE)" >> $GITHUB_OUTPUT

      - name: Create latest.json
        if: steps.exe.outputs.EXE_PATH != ''
        id: latest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          EXE_NAME="$(basename "$EXE_PATH")"
          SIG_PATH="${EXE_PATH}.sig"

          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\n')
            echo "SIGNATURE_LENGTH=${#SIGNATURE}" >> $GITHUB_OUTPUT
          else
            SIGNATURE=""
            echo "SIGNATURE_LENGTH=0" >> $GITHUB_OUTPUT
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/${{ github.ref_name }}/$EXE_NAME"
              }
            }
          }
          JSONEOF

          cat latest.json

      - name: Create GitHub Release
        uses: softprops/gh-release@v1
        with:
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
