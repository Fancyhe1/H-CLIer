name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app (unsigned)
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri:build

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get exe path
        id: exe
        run: |
          $exe = Get-ChildItem "aicoder/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          echo "EXE_PATH=$($exe.FullName)" >> $GITHUB_OUTPUT

      - name: Sign the app
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $exePath = "${{ steps.exe.outputs.EXE_PATH }}"
          npm run tauri signer sign -- "$exePath"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest.json with signature
        id: latest
        run: |
          $exePath = "${{ steps.exe.outputs.EXE_PATH }}"
          $sigPath = "$exePath.sig"
          $exe = Get-ChildItem $exePath
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $signature = if (Test-Path $sigPath) { (Get-Content $sigPath -Raw).Trim() } else { "" }

          $latestJson = @{
            version = "${{ steps.version.outputs.VERSION }}"
            date = (Get-Date -Format "yyyy-MM-dd")
            body = "Release v${{ steps.version.outputs.VERSION }}"
            url = "https://github.com/Fancyhe1/H-CLIer/releases/download/v${{ steps.version.outputs.VERSION }}/$($exe.Name)"
            sha256 = $sha256
            signature = $signature
          } | ConvertTo-Json -Compress

          Set-Content -Path latest.json -Value $latestJson -Encoding UTF8
          echo "SIGNATURE_LENGTH=$($signature.Length)" >> $GITHUB_OUTPUT

      - name: Upload latest.json to H-CLIer repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $SHA = $(gh api repos/Fancyhe1/H-CLIer/contents/latest.json --jq '.sha' 2>/dev/null || echo "")
          $BODY = "Update latest.json for v${{ steps.version.outputs.VERSION }}"

          if ($SHA) {
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json `
              --method PUT `
              --field message="$BODY" `
              --field content="$(Get-Content latest.json -Raw | base64)" `
              --field branch=main `
              --field sha="$SHA"
          } else {
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json `
              --method PUT `
              --field message="$BODY" `
              --field content="$(Get-Content latest.json -Raw | base64)" `
              --field branch=main
          }

      - name: Upload signature file to H-CLIer repo
        if: steps.latest.outputs.SIGNATURE_LENGTH != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sigPath = "${{ steps.exe.outputs.EXE_PATH }}.sig"
          if (Test-Path $sigPath) {
            $sigName = (Get-ChildItem "aicoder/src-tauri/target/release/bundle/nsis/*.sig" | Select-Object -First 1).Name
            $releaseUrl = "https://uploads.github.com/repos/Fancyhe1/H-CLIer/releases/assets"

            # Upload .sig file as release asset
            $assetUrl = $(gh api repos/Fancyhe1/H-CLIer/releases --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .upload_url' | tr -d '{}')
            $assetUrl = $assetUrl -replace '\{\?name,label\}', "?name=$sigName"

            Invoke-RestMethod -Uri $assetUrl -Headers @{ Authorization = "Bearer $GH_TOKEN" } -Method POST -InFile $sigPath -ContentType "application/octet-stream"
          }