name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app
        working-directory: ./aicoder
        run: npm run tauri:build

      - name: Find exe
        id: exe
        shell: bash
        run: |
          EXE=$(ls aicoder/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v ".0.exe" | head -1)
          echo "EXE_PATH=$EXE" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$(basename $EXE)" >> $GITHUB_OUTPUT

      - name: Sign the app
        if: steps.exe.outputs.EXE_PATH != ''
        shell: bash
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Write key to file
          echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > signing_key.pem
          echo "Key length: $(wc -c < signing_key.pem)"

# Unset env var so it doesn't conflict with --private-key-path
          unset TAURI_SIGNING_PRIVATE_KEY

          # Sign using node directly (bypasses npm stdin issues)
          # Redirect stdin from /dev/null to prevent any interactive prompts from blocking
          node ./node_modules/@tauri-apps/cli/tauri.js signer sign --private-key-path signing_key.pem "${{ steps.exe.outputs.EXE_PATH }}" </dev/null

      - name: Create GitHub Release
        if: steps.exe.outputs.EXE_PATH != ''
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest.json
        if: steps.exe.outputs.EXE_PATH != ''
        id: latest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#refs/tags/}"
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          EXE_NAME="$(basename $EXE_PATH)"
          SIG_PATH="${EXE_PATH}.sig"

          SHA256=$(powershell -Command "Get-FileHash -Path '$EXE_PATH' -Algorithm SHA256 | Select-Object -ExpandProperty Hash")

          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\n')
          else
            SIGNATURE=""
          fi

          echo "SIGNATURE_LENGTH=${#SIGNATURE}" >> $GITHUB_OUTPUT

          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "date": "$(date +%Y-%m-%d)",
            "body": "Release $VERSION",
            "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/$VERSION/$EXE_NAME",
            "sha256": "$SHA256",
            "signature": "$SIGNATURE"
          }
          JSONEOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Upload latest.json to H-CLIer repo
        if: steps.latest.outputs.SIGNATURE_LENGTH != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#refs/tags/}"
          SHA=$(gh api repos/Fancyhe1/H-CLIer/contents/latest.json --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(cat latest.json | base64 -w 0)

          if [ -n "$SHA" ]; then
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main \
              --field sha="$SHA"
          else
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main
          fi