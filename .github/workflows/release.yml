name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app
        working-directory: ./aicoder
        run: npm run tauri:build

      - name: Find exe
        id: exe
        shell: bash
        run: |
          EXE=$(ls aicoder/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | grep -v ".0.exe" | head -1)
          echo "EXE_PATH=$EXE" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$(basename $EXE)" >> $GITHUB_OUTPUT

      - name: Sign the app
        if: steps.exe.outputs.EXE_PATH != ''
        shell: bash
        working-directory: ./aicoder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Write key to file
          echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > signing_key.pem
          echo "Key length: $(wc -c < signing_key.pem)"

          # CRITICAL: unset TAURI_SIGNING_PRIVATE_KEY before running node to avoid conflict
          unset TAURI_SIGNING_PRIVATE_KEY

          # Sign with key file path via env var, suppress interactive input
          TAURI_SIGNING_PRIVATE_KEY_PATH=signing_key.pem node ./node_modules/@tauri-apps/cli/tauri.js signer sign "${{ steps.exe.outputs.EXE_PATH }}" </dev/null

      - name: Create latest.json
        if: steps.exe.outputs.EXE_PATH != ''
        id: latest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#refs/tags/}"
          EXE_PATH="${{ steps.exe.outputs.EXE_PATH }}"
          EXE_NAME="$(basename $EXE_PATH)"
          SIG_PATH="${EXE_PATH}.sig"

          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\n')
            echo "SIGNATURE_LENGTH=${#SIGNATURE}" >> $GITHUB_OUTPUT
          else
            SIGNATURE=""
            echo "SIGNATURE_LENGTH=0" >> $GITHUB_OUTPUT
          fi

          # Format date as ISO 8601 for Tauri 2.x
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Tauri 2.x requires platforms-specific JSON structure
          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/$VERSION/$EXE_NAME"
              }
            }
          }
          JSONEOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Create GitHub Release
        if: steps.exe.outputs.EXE_PATH != ''
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json to H-CLIer repo
        if: steps.latest.outputs.SIGNATURE_LENGTH != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#refs/tags/}"
          SHA=$(gh api repos/Fancyhe1/H-CLIer/contents/latest.json --jq '.sha' 2>/dev/null || echo "")
          CONTENT=$(cat latest.json | base64 -w 0)

          if [ -n "$SHA" ]; then
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main \
              --field sha="$SHA"
          else
            gh api repos/Fancyhe1/H-CLIer/contents/latest.json \
              --method PUT \
              --field message="Update latest.json for $VERSION" \
              --field content="$CONTENT" \
              --field branch=main
          fi