name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # 用于创建 Release（需配合 PAT 使用）
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout private code (smart-coder)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aicoder/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./aicoder
        run: npm ci

      - name: Build Tauri app (auto-signs)
        working-directory: ./aicoder
        run: npm run tauri build   # 已经自动生成 .exe 和 .sig

      - name: List generated files
        shell: bash
        run: ls -la aicoder/src-tauri/target/release/bundle/nsis/

      - name: Create latest.json
        id: latest
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"   # 去掉开头的 'v'
          EXE_PATH=$(ls aicoder/src-tauri/target/release/bundle/nsis/*.exe | grep -v "_0.exe" | head -1)
          EXE_NAME=$(basename "$EXE_PATH")
          SIG_PATH="${EXE_PATH}.sig"

          if [ -f "$SIG_PATH" ]; then
            SIGNATURE=$(cat "$SIG_PATH" | tr -d '\r\n')
          else
            echo "❌ .sig file not found! Did Tauri auto-sign the app?"
            exit 1
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << JSONEOF
          {
            "version": "$VERSION",
            "notes": "Release $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/Fancyhe1/H-CLIer/releases/download/${{ github.ref_name }}/$EXE_NAME"
              }
            }
          }
          JSONEOF
          cat latest.json

      # 需要先检出公开仓库 H-CLIer，以便后续推送 latest.json
      - name: Checkout public repo (H-CLIer)
        uses: actions/checkout@v4
        with:
          repository: Fancyhe1/H-CLIer
          token: ${{ secrets.GH_PAT }}    # 注意：必须使用 PAT，不能用 GITHUB_TOKEN
          path: H-CLIer-public

      - name: Copy latest.json to public repo
        run: cp latest.json H-CLIer-public/latest.json

      - name: Commit and push latest.json
        working-directory: ./H-CLIer-public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "chore: update latest.json for ${{ github.ref_name }}"
          git push

      - name: Create Release in H-CLIer
        uses: softprops/action-gh-release@v2
        with:
          repository: Fancyhe1/H-CLIer        # 👈 发布到公开仓库
          token: ${{ secrets.GH_PAT }}         # 👈 使用 PAT
          files: |
            aicoder/src-tauri/target/release/bundle/nsis/*.exe
            aicoder/src-tauri/target/release/bundle/nsis/*.sig
            latest.json
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          make_latest: true
